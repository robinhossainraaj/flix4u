name: Refresh Flix4U public catalog

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flix4u-catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate public catalog
        run: node scripts/generate-github-catalog.mjs

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit -m "chore: refresh public Flix4U catalog"
            git push
          fi
